version: 2.1
workflows:
  version: 2
  test:
    jobs:
      - test-py312
jobs:
  test-py312:
    environment:
      COLUMNS: 160
      # default is /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PATH: /root/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    docker:
      - image: python:3.12
    working_directory: ~/repo
    steps: &steps
      - checkout
      - run:
          name: Install deps
          command: |
            echo PATH=$PATH
            apt-get update
            apt-get install -y libturbojpeg0
            pip install codecov pipdeptree
            pip install -q --user --upgrade -r requirements.txt

      - run:
          name: List deps
          command: |
            mkdir -p artifacts
            pip list | tee artifacts/pip-list.txt
            pipdeptree | tee artifacts/pipdeptree.txt
      - run:
          name: Install Gym-Duckiematrix
          command: |
            python -m pip install --user --no-deps .

      - run:
          name: Run tests
          command: |
            make test

      - store_test_results:
          when: always
          path: out/test-results

      - run:
          name: Coverage report
          when: always
          command: |
            make coverage-combine
            make coverage-report
            coverage xml


      - store_artifacts:
          when: always
          path: out/coverage
          destination: coverage

      - store_artifacts:
          when: always
          path: out/tests
          destination: tests

      - run:
          name: CodeCov
          when: always
          command: |
            codecov
